model = "Qwen/Qwen3.5-4B"
dataset = "saad1926q/8-puzzle"
dataset_subset = "rl"
dataset_split = "run_1"
output_dir = "outputs/rl/run-1-balanced"
vllm_server_url = "http://localhost:8000"
use_vllm = true
vllm_mode = "colocate"
vllm_gpu_memory_utilization = 0.3
vllm_enable_sleep_mode = true
max_steps = -1
num_train_epochs = 1
save_steps = 5
logging_steps = 1
per_device_train_batch_size = 1
gradient_accumulation_steps = 8
num_generations = 8
max_turn_tokens = 2048
history_turns = 4
loss_type = "dapo"
epsilon = 0.2
epsilon_high = 0.28
mask_truncated_completions = true
vllm_importance_sampling_correction = true
learning_rate = 0.000005
temperature = 1.0
top_p = 1.0
seed = 42
report_to = "wandb"
bf16 = true
gradient_checkpointing = true
use_lora = true
lora_r = 16
lora_alpha = 16
