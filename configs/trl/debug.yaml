model: saad1926q/qwen3-1.7b-15puzzle-sft-depth-8-15

dataset:
  name: saad1926q/15-puzzle
  subset: rl
  split: rl

curriculum:
  sigma: 0.75
  beta: 0.25
  min_prob: 0.0

env:
  max_turns: 120

trl:
  output_dir: outputs/trl/debug
  max_steps: 10
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_generations: 8
  learning_rate: 1.0e-06
  bf16: true
  gradient_checkpointing: true
  max_completion_length: 4096
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.22
  vllm_max_model_length: 4096
  logging_steps: 1
  save_strategy: steps
  save_steps: 1
  report_to: ["wandb"]
  run_name: fifteen-puzzle-trl-debug
  seed: 0
  log_completions: true
  num_completions_to_print: 2
  resume_from_checkpoint: null
