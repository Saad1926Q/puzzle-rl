# Step-based LoRA SFT configuration for the 8-puzzle decision dataset.
model = "Qwen/Qwen3.5-4B"
dataset = "saad1926q/8-puzzle"
dataset_config = "sft"
dataset_split = "train"
output_dir = "outputs/sft/qwen3.5-4b"
max_steps = 120
save_steps = 20
save_total_limit = 6
logging_steps = 1
per_device_train_batch_size = 1
gradient_accumulation_steps = 16
learning_rate = 0.00005
warmup_ratio = 0.05
max_length = 2048
seed = 42
bf16 = true
gradient_checkpointing = true
lora_r = 16
lora_alpha = 32
lora_dropout = 0.05
report_to = "wandb"
