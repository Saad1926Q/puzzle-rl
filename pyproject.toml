[project]
name = "smth-rl"
version = "0.1.0"
description = "Tiny sliding-puzzle RL/eval sandbox"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=4.6.1",
    "gepa>=0.1.4,<0.2",
    "openai>=2.44.0",
    "python-dotenv>=1.1.0",
    "torch==2.11.0",
    "tqdm>=4.68.3",
    "transformers==5.13.0",
    "wandb>=0.28.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puzzle3", "src/evaluation", "src/prompt_optimization"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
